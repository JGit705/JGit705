<svg xmlns="http://www.w3.org/2000/svg" width="600" height="364" viewBox="0 0 600 364" role="img" aria-label="MOTIntel: used car reliability from 42.7 million UK MOT tests in 2025, with an LLM layer checked against the data. Chart shows failure rate peaking at 42.7% for 18 to 21 year old cars.">
<title>MOTIntel: used car reliability from 42.7 million UK MOT tests in 2025, with an LLM layer checked against the data. Chart shows failure rate peaking at 42.7% for 18 to 21 year old cars.</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}}

.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.16,1,.3,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out 2s infinite both}
@keyframes ping{0%{opacity:.8;transform:scale(1)}80%,100%{opacity:0;transform:scale(3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
