nchor="middle" font-size="11.5" fill="#5A6C8C">18–21y</text><circle class="ping" cx="452" cy="51.0" r="3.5" fill="#FFB020"/><circle cx="452" cy="51.0" r="3.5" fill="#FFB020"/><g class="grow" style="animation-delay:0.73s"><rect x="476" y="68.0" width="72" height="64.0" rx="4" fill="#4DA3FF" fill-opacity="0.22"/><rect x="476" y="68.0" width="72" height="2.5" rx="1" fill="#4DA3FF"/></g><text class="mono fade" style="animation-delay:1.43s" x="512.0" y="60.0" text-anchor="middle" font-size="13" font-weight="400" fill="#E6EDF7">33.3%</text><text class="mono" x="512.0" y="151" text-anchor="middle" font-size="11.5" fill="#5A6C8C">27–30y</text></g>
