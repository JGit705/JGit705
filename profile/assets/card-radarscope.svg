<svg xmlns="http://www.w3.org/2000/svg" width="600" height="364" viewBox="0 0 600 364" role="img" aria-label="RadarScope: a radar-style plan-position indicator for live air traffic over ADS-B, with a rotating sweep and a heading glyph per aircraft.">
<title>RadarScope: a radar-style plan-position indicator for live air traffic over ADS-B, with a rotating sweep and a heading glyph per aircraft.</title>
<style>
