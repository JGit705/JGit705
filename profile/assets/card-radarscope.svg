.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}}

.sweep{transform-box:view-box;transform-origin:116px 82px;animation:spin 4.0s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{animation:blip 4.0s linear infinite}
@keyframes blip{0%{opacity:1}65%,100%{opacity:.2}}
.row{animation:row 4.0s linear infinite}
@keyframes row{0%{fill:#FFB020}30%,100%{fill:#8B9BB4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
