<svg xmlns="http://www.w3.org/2000/svg" width="600" height="364" viewBox="0 0 600 364" role="img" aria-label="SkyTrack: detects and tracks aircraft from a camera, then matches each one to a real flight using ADS-B. Runs entirely locally.">
<title>SkyTrack: detects and tracks aircraft from a camera, then matches each one to a real flight using ADS-B. Runs entirely locally.</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}}

.lock{transform-box:fill-box;transform-origin:center;animation:lock 10s cubic-bezier(.16,1,.3,1) infinite}
@keyframes lock{0%,34%{transform:scale(1.5);stroke:#FFB020}40%,100%{transform:scale(1);stroke:#3DDC97}}
.seek{animation:seek 10s linear infinite}
@keyframes seek{0%,36%{opacity:1}38%,100%{opacity:0}}
.found{animation:found 10s linear infinite}
@keyframes found{0%,37%{opacity:0}40%,100%{opacity:1}}
.drift{animation:drift 24s linear infinite}
@keyframes drift{to{transform:translateX(-300px)}}
.rec{animation:rec 1.4s steps(1) infinite}
@keyframes rec{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="cg-m" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1E2E4A" stroke-opacity=".5"/></pattern><pattern id="cg" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#cg-m)"/><path d="M100 0H0V100" fill="none" stroke="#1E2E4A"/></pattern><clipPath id="card"><rect width="600" height="364" rx="16"/></clipPath><clipPath id="band"><rect width="600" height="160"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08101F"/><stop offset="1" stop-color="#12305A"/></linearGradient><filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="6"/></filter></defs>

<g clip-path="url(#card)">
<rect width="600" height="364" fill="#0E1729"/>
<rect width="600" height="160" fill="#0B1220"/>
<rect width="600" height="160" fill="url(#cg)" opacity=".7"/>
<g clip-path="url(#band)">
<rect width="600" height="160" fill="url(#sky)"/>
<circle cx="40" cy="40" r="1" fill="#CFE3FF" opacity=".35"/><circle cx="132" cy="22" r="1" fill="#CFE3FF" opacity=".35"/><circle cx="210" cy="60" r="1" fill="#CFE3FF" opacity=".35"/><circle cx="300" cy="18" r="1" fill="#CFE3FF" opacity=".35"/><circle cx="455" cy="34" r="1" fill="#CFE3FF" opacity=".35"/><circle cx="540" cy="70" r="1" fill="#CFE3FF" opacity=".35"/><circle cx="570" cy="20" r="1" fill="#CFE3FF" opacity=".35"/><circle cx="260" cy="110" r="1" fill="#CFE3FF" opacity=".35"/>
<g class="drift"><ellipse cx="90" cy="116" rx="90" ry="7" fill="#9CC4FF" opacity=".07" filter="url(#blur)"/><ellipse cx="380" cy="92" rx="120" ry="7" fill="#9CC4FF" opacity=".07" filter="url(#blur)"/><ellipse cx="620" cy="132" rx="100" ry="7" fill="#9CC4FF" opacity=".07" filter="url(#blur)"/><ellipse cx="860" cy="104" rx="90" ry="7" fill="#9CC4FF" opacity=".07" filter="url(#blur)"/></g>
<g><animateMotion dur="10s" repeatCount="indefinite" path="M-260 128 C80 76 360 50 700 58"/>
<path d="M15 0L9 -1.8L2 -1.8L-4 -12L-7.5 -12L-3.5 -1.8L-10 -1.8L-13 -6L-15.5 -6L-14 0L-15.5 6L-13 6L-10 1.8L-3.5 1.8L-7.5 12L-4 12L2 1.8L9 1.8Z" fill="#E6EDF7"/>
<path class="lock" d="M-30 -12V-22H-20M20 -22H30V-12M30 12V22H20M-20 22H-30V12" fill="none" stroke="#FFB020" stroke-width="2"/>
<g class="seek"><rect x="38" y="-34" width="158" height="21" rx="4" fill="#0B1220" fill-opacity=".85" stroke="#FFB020" stroke-opacity=".6"/>
<text class="mono" x="46" y="-19" font-size="11.5" fill="#FFB020">AIRCRAFT · CONF 0.91</text></g>
<g class="found"><rect x="38" y="-34" width="180" height="21" rx="4" fill="#0B1220" fill-opacity=".85" stroke="#3DDC97" stroke-opacity=".6"/>
<text class="mono" x="46" y="-19" font-size="11.5" fill="#3DDC97">BAW283 · A350 · MATCHED</text></g>
</g>
<text class="mono" x="20" y="28" font-size="11.5" letter-spacing="1.1" fill="#8B9BB4">CAM 01 · LOCAL INFERENCE</text>
<circle class="rec" cx="534" cy="24" r="4" fill="#FF5C7A"/>
<text class="mono" x="580" y="28" text-anchor="end" font-size="11.5" letter-spacing="1.1" fill="#8B9BB4">REC</text>
<text class="mono" x="20" y="148" font-size="11.5" letter-spacing="1.1" fill="#8B9BB4">VISION TRACK ↔ ADS-B FLIGHT</text>
</g>
<path d="M0 160.5H600" stroke="#1E2E4A"/>
</g>
<rect x=".5" y=".5" width="599" height="363" rx="16" fill="none" stroke="#1E2E4A"/>
<text class="mono" x="28" y="198" font-size="13" letter-spacing="1.2" fill="#4DA3FF">COMPUTER VISION · RUNS LOCALLY</text>
<rect x="460.3" y="181" width="111.7" height="24" rx="12" fill="#8B9BB4" fill-opacity=".08" stroke="#8B9BB4" stroke-opacity=".4"/>
<text class="mono" x="516.1" y="197" text-anchor="middle" font-size="11.5" letter-spacing=".6" fill="#8B9BB4">PRIVATE BUILD</text>
<text x="28" y="238" font-size="28" font-weight="700" letter-spacing="-.4" fill="#E6EDF7">SkyTrack</text>
<text x="28" y="268" font-size="16.5" fill="#8B9BB4">Point a camera at the sky. It detects and tracks aircraft, then</text>
<text x="28" y="292" font-size="16.5" fill="#8B9BB4">works out which real flights they are. No cloud, no upload.</text>
<g class="fade" style="animation-delay:0.30s"><rect x="28.0" y="312.0" width="70.6" height="30" rx="15.0" fill="#14223A" stroke="#1E2E4A"/><text class="mono" x="63.3" y="331.7" text-anchor="middle" font-size="13.5" fill="#E6EDF7">Python</text></g><g class="fade" style="animation-delay:0.37s"><rect x="106.6" y="312.0" width="54.4" height="30" rx="15.0" fill="#14223A" stroke="#1E2E4A"/><text class="mono" x="133.8" y="331.7" text-anchor="middle" font-size="13.5" fill="#E6EDF7">YOLO</text></g><g class="fade" style="animation-delay:0.44s"><rect x="169.0" y="312.0" width="70.6" height="30" rx="15.0" fill="#14223A" stroke="#1E2E4A"/><text class="mono" x="204.3" y="331.7" text-anchor="middle" font-size="13.5" fill="#E6EDF7">OpenCV</text></g><g class="fade" style="animation-delay:0.51s"><rect x="247.6" y="312.0" width="78.7" height="30" rx="15.0" fill="#14223A" stroke="#1E2E4A"/><text class="mono" x="286.9" y="331.7" text-anchor="middle" font-size="13.5" fill="#E6EDF7">FastAPI</text></g><g class="fade" style="animation-delay:0.58s"><rect x="334.3" y="312.0" width="62.5" height="30" rx="15.0" fill="#14223A" stroke="#1E2E4A"/><text class="mono" x="365.5" y="331.7" text-anchor="middle" font-size="13.5" fill="#E6EDF7">ADS-B</text></g>

</svg>
